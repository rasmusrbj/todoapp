name: Feature or change
description: Propose something new, or a different approach
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: >
        If it touches the API, sketch the proto change — that is where every discussion
        here ends up anyway.

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Including doing nothing.
