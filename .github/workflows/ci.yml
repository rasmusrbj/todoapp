name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Raises the Buf Schema Registry's anonymous rate limit for the remote Python
  # plugins. Optional — without it codegen still works, but a busy day can return
  # `resource_exhausted`. Add it under Settings → Secrets if that starts happening.
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` needs history to compare against.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - name: Check for breaking changes against main
        # Informational on main itself, where there is nothing to compare to.
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todoapp
          # C collation, matching docker-compose: label uniqueness is a functional
          # index on lower(name), and collation changes index behaviour.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DB_URL / TEST_DB_URL are what the Makefile passes to the tools; setting only the
      # TODOAPP_* variables did nothing, because the recipes override them from these.
      DB_URL: postgresql://postgres:postgres@localhost:5432/todoapp
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/todoapp_test
      TODOAPP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/todoapp
      TODOAPP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/todoapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Create the test database
        run: psql "$DB_URL" -f scripts/init-test-db.sql
        env:
          PGPASSWORD: postgres

      - run: make install-backend
      - run: make generate-backend
      - run: make lint-backend
      - run: make migrate
      - name: Tests
        # The suite creates its own fixtures; it does not depend on the seed.
        run: make test

      - name: Seed refuses to invent a credential
        # The seed asks for an account interactively. There is no terminal here, so it
        # must fail loudly rather than fall back to a default password — that fallback
        # is exactly how a known admin credential reaches a deployment.
        run: |
          if make seed < /dev/null 2>&1 | tee /tmp/seed.log; then
            echo "::error::the seed should have refused without credentials"; exit 1
          fi
          grep -q "no terminal" /tmp/seed.log

      - name: Seed works when told what to create
        run: |
          make seed TODOAPP_DEMO_EMAIL=ci@example.com \
                    TODOAPP_DEMO_PASSWORD=ci-password-for-tests

  web:
    name: Web
    runs-on: ubuntu-latest
    # `web/.npmrc` pulls @fortawesome from a licensed private registry, and secrets are
    # not exposed to pull requests from forks. So this job cannot run for an outside
    # contributor — it is skipped rather than failed, and the backend, CLI and iOS jobs
    # still cover their PR. See CONTRIBUTING.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Skipped rather than failed when the token is absent: a job that is red on every
      # run teaches people to ignore red. Add the secret with
      # `gh secret set FONTAWESOME_NPM_TOKEN` and this starts covering the web app.
      - name: Is the icon registry token available?
        id: icons
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
        run: |
          if [ -n "$FONTAWESOME_NPM_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FONTAWESOME_NPM_TOKEN is not set, so the web app was not built. Add it under Settings → Secrets and variables → Actions."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.icons.outputs.available == 'true'
        run: make install-web
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
      - if: steps.icons.outputs.available == 'true'
        run: make generate-web
      - if: steps.icons.outputs.available == 'true'
        run: make lint-web
      - if: steps.icons.outputs.available == 'true'
        run: make build

  ios:
    name: iOS
    runs-on: macos-15
    # Informational for now: this needs Xcode 26 with the iOS 26 SDK, and whether a
    # GitHub-hosted image has it varies. It is marked non-blocking rather than pinned to
    # a self-hosted runner, because a public repository should not hand fork PRs access
    # to private hardware. Flip this off once a run has passed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # GitHub-hosted images lag behind on Xcode. Rather than failing red on every run
      # until they catch up, this picks the newest Xcode present and stops cleanly when
      # it is too old for the iOS 26 deployment target.
      - name: Select the newest Xcode
        id: xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "::warning::no Xcode on this runner — skipping the iOS job"
            echo "usable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sudo xcode-select -s "$newest"
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          xcodebuild -version
          if [ "$major" -lt 26 ]; then
            echo "::warning::$newest is Xcode $major; this app targets iOS 26 — skipping"
            echo "usable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "usable=true" >> "$GITHUB_OUTPUT"
      - if: steps.xcode.outputs.usable == 'true'
        run: brew install xcodegen
      # Swift codegen uses local plugins, so this needs no network and cannot be
      # rate-limited by the registry.
      - if: steps.xcode.outputs.usable == 'true'
        run: brew install swift-protobuf protoc-gen-connect-swift
      - if: steps.xcode.outputs.usable == 'true'
        run: make generate-ios
      - if: steps.xcode.outputs.usable == 'true'
        run: make ios-project
      - name: Build and run the hermetic tests
        if: steps.xcode.outputs.usable == 'true'
        run: make ios-test IOS_SIM='iPhone 16 Pro Max'
