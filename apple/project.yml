# XcodeGen is the source of truth for the Xcode project — `Todoapp.xcodeproj` is
# generated and not checked in. Run `make ios-project` (or `xcodegen` in this
# directory) after adding a target, a source directory, or a dependency.
#
# Layout mirrors the Happenings Apple workspace: app-agnostic UI in
# `DesignSystem/`, app-agnostic plumbing in `Core/`, product code under
# `Apps/<App>/`, generated protobuf/Connect stubs in `gen/`.
name: Todoapp

options:
  # Only used for targets that do not set an identifier explicitly; the real one
  # comes from Signing.xcconfig so a fork does not collide with anyone else's.
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  # English is the development language; Danish is a full translation, not a
  # fallback. Both are listed so the String Catalog exports and compiles them.
  developmentLanguage: en
  knownRegions:
    - en
    - da
    - Base
  deploymentTarget:
    iOS: "26.0"

packages:
  Connect:
    url: https://github.com/connectrpc/connect-swift
    from: "1.2.3"
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.31.0"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Todoapp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Core
      - path: DesignSystem
      - path: gen
      - path: Apps/Todo/iOS
      - path: Apps/Todo/Resources
    dependencies:
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    info:
      path: Apps/Todo/Info.plist
      properties:
        CFBundleDisplayName: Todoapp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The Mac serving the dev backend, for builds running on a real device where
        # loopback is the phone itself. Injected by `make ios-device`; empty otherwise,
        # which the simulator neither needs nor reads.
        TodoappDevHost: "$(TODOAPP_DEV_HOST)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The dev backend is plain HTTP on the loopback interface, which App
        # Transport Security blocks by default. The exception is scoped to
        # loopback only — it does not permit cleartext to any other host, and a
        # release build points at HTTPS regardless (see AppConfig).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Todoapp
        SWIFT_STRICT_CONCURRENCY: complete
        # Emits every `Text("key")` into the String Catalog on build, so a new
        # user-facing string shows up as untranslated instead of silently
        # rendering its key.
        SWIFT_EMIT_LOC_STRINGS: YES
        # iPhone + iPad. The layout branches on horizontal size class rather
        # than stretching the phone layout (see AdaptiveNavigation).
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # Overridden on the command line by `make ios-device`.
        TODOAPP_DEV_HOST: ""

  TodoappTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Todo/Tests
    dependencies:
      - target: Todoapp
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app so `@testable import Todoapp` reaches Core,
        # DesignSystem and the app internals, and so the tests resolve the
        # app bundle's compiled String Catalog.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Todoapp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Todoapp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TodoappUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Todo/UITests
    dependencies:
      - target: Todoapp
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Todoapp

schemes:
  Todoapp:
    build:
      targets:
        Todoapp: all
        TodoappTests: [test]
        TodoappUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - TodoappTests
        - TodoappUITests
    run:
      config: Debug
