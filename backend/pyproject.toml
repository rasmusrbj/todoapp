[project]
name = "todoapp-backend"
version = "0.1.0"
description = "ConnectRPC backend for the todo app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned: connect-python is beta and 1.0 will ship a new Protobuf runtime.
    "connectrpc==0.10.1",
    "protobuf>=6.32,<7",
    "uvicorn[standard]>=0.35",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=25.1",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.28",
    "ruff>=0.13",
    "ty>=0.0.1a20",
]

[project.scripts]
todoapp = "todoapp.cli.main:main"
todoapp-migrate = "todoapp.db.migrate:main"
todoapp-seed = "todoapp.db.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `todoapp` is hand-written; `todo` is generated by `buf generate` into gen/,
# kept in a separate root so `clean: true` can never touch hand-written source.
packages = ["src/todoapp", "gen/todo"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "A",               # builtin shadowing
    "C4",              # comprehensions
    "SIM",             # simplify
    "RUF",
    "ASYNC",           # async pitfalls
    "D",               # pydocstyle
    "ANN",             # missing annotations
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow Any where the ASGI protocol demands it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["todoapp", "todo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "gen", "."]

[tool.ty.environment]
python-version = "3.12"
